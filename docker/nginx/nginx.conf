# 主 Nginx 配置（部署时由 deploy 脚本替换为 blue/green 版本）
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream frontend_blue {
        server leapbud-lease-frontend-blue:80;
    }

    upstream backend_blue {
        server leapbud-lease-backend-blue:3410;
    }

    # 协议 PDF 等上传/生成可能较大、较慢
    client_max_body_size 50m;

    server {
        listen 80;
        server_name localhost;

        location /files/ {
            alias /var/uploads/;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        location / {
            proxy_pass http://frontend_blue;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend_blue/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
