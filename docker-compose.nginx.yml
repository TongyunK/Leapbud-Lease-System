# Nginx 入口（蓝绿流量切换）

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  nginx:
    image: nginx:alpine
    container_name: leapbud-lease-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      # HTTP / HTTPS（勿占用宿主机 :80，留给 acme-edge）
      - "3400:80"
      - "3443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 共用 ACME IP 证书（勿拷贝到本仓库；续期由 acme-edge 统一更新）
      # 本机开发可在 .env 设 SSL_HOST_PATH=./docker/nginx/ssl 并放自签名 pem
      - ${SSL_HOST_PATH:-/home/proj_deploy/Documents/acme-edge/ssl}:/etc/nginx/ssl:ro
      # 与后端同一宿主机目录，供 /files/ 静态加速（房间图、旧附件）
      - ${UPLOADS_HOST_PATH:-/opt/project-deployment/leapbud-lease}:/var/uploads:ro
    networks:
      - leapbud-lease-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

networks:
  leapbud-lease-network:
    external: true
